name: build
on:
  push:
    branches: [main, feature/initial-library]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Tests (.NET 8 and 10)
        run: dotnet test tests/HamContest.Tests -c Release --logger "console;verbosity=normal"
      - name: Example, persistence and Cabrillo smoke test
        run: dotnet run --project examples/HamContest.Example -c Release
      - name: NuGet package (no publication)
        run: dotnet pack src/HamContest -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: HamContest-preview-${{ matrix.os }}
          path: artifacts/*.nupkg
